{%extends 'base.html'%}
{% load static %}
{%block content%}

<div class="code-box">
<h2 style="color: black;">Enter Quiz Code</h2>
<form method="POST">
	{%csrf_token%}
	<input type="text" style="background-color: #dedede; color: black;" name="code" placeholder="Enter code here" required><br>
	<button type="submit";>Start Quiz</button>
	{% if form.errors %}
		<p style="color: darkred;">Invalid code.</p>
	{% endif %}
</form>

{%endblock%}
