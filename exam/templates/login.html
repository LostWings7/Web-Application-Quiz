{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="{% static 'icons.css' %}">
<style>
	body{
		margin:0;
		padding: 0;
		height: 100vh;
		display: flex;
		justify-content: center;
		align-items: center;
		font-family: Arial, sans-serif;
		background-color: #2b2b2b;
	}

	.login-container{
		background: white;
		padding: 25px 40px;
		border-radius: 10px;
		box-shadow: 0 0 10px rgba(0,0,0,0.1);
		width: 100%;
		max-width: 400px;
	}

	h2{
		text-align: center;
		margin-top: 20px;
		margin-bottom: 20px;
		font-size: 30px;
	}

	.form-group{
		position: relative;
		margin-bottom: 20px;
	}

	.form-group i{
		position: absolute;
		top: 50%;
		left: 10px;
		transform: translateY(-50%);
		color: limegreen;
	}

	.form-group input{
		width: 87%;
		padding: 10px 10px 10px 40px;
		border: 1px solid #ccc;
		border-radius: 5px;
	}

	button{
		width: 100%;
		padding: 10px;
		background-color: #007bff;
		border: none;
		color: white;
		border-radius: 5px;
		cursor: pointer;
	}

	button:hover{
		background-color: #0056b3;
	}

	.error{
		color: darkred;
		text-align: center;
	}

</style>
</head>
<body>
	<div class="login-container">
		<h2>Login</h2>
		<form method='post'>
			{% csrf_token %}
			
			<div class="form-group">
				<i class="gg-profile"></i>
				{{form.username}}
			</div>

			<div class="form-group">
				{{form.password}}
				<i class="gg-lock" style="top: 65%; left: 15px;"></i>
			</div>

			<div class="form-group">
				<i class="gg-arrow-right-o" style="color: white; left: 219px; top: 52%; pointer-events: none;"></i>
				<button type="submit" style="text-align: left; font-size: 15px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Confirm</button>
			</div>
			
		{% if form.errors %}
			<p class="error">Invalid username or password.</p>
		{% endif %}
		</form>
	</div>
</body>
</html>
